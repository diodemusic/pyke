[project]
name = "pyke-lol"
version = "3.2.0"
description = "A Riot API wrapper specifically for League of Legends."
authors = [{ name = "diodemusic" }]
license = "MIT"
license-files = ["LICENCE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]
keywords = [
    "riot api",
    "league of legends",
    "lol api",
    "riot python",
    "riot wrapper",
    "LoL",
    "League of Legends",
    "Riot Games",
    "API",
    "REST",
    "restful api",
]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=1.3.0", "respx>=0.22.0"]
lint = ["black>=24.0.0", "mypy>=1.18.2", "bandit>=1.8.6"]
docs = ["pdoc>=15.0.4"]
dev = [
    "python-dotenv>=1.1.1",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyke"
source-include = ["tests/**"]

[tool.pyright]
reportPrivateUsage = false
typeCheckingMode = "strict"

[tool.ruff.per-file-ignores]
"tests/*" = ["F401", "F811"]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnusedImport = "none"
reportMissingTypeStubs = "none"

exclude = [".env", "tests/*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
asyncio_default_fixture_loop_scope = "session"
