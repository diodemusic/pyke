[project]
name = "pyke-lol"
version = "3.3.0"
description = "A Riot API wrapper specifically for League of Legends."
authors = [{ name = "diodemusic" }]
license = "MIT"
license-files = ["LICENCE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]
keywords = [
    "riot api",
    "league of legends",
    "lol api",
    "riot python",
    "riot wrapper",
    "LoL",
    "League of Legends",
    "Riot Games",
    "API",
    "REST",
    "restful api",
]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=1.3.0", "respx>=0.22.0"]
lint = ["mypy>=1.18.2", "ruff>=0.17.6"]
docs = ["pdoc>=15.0.4"]
dev = [
    "python-dotenv>=1.1.1",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyke"
source-include = ["tests/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "ERA"]
ignore = ["E501", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S311"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
strict = true
files = ["src", "tests", "examples", "generators"]
warn_return_any = false                            # TODO: delete this when Any is not being used anymore

[[tool.mypy.overrides]]
module = ["caseconverter"]
ignore_missing_imports = true
